info:
  title: The Truth Pill API
  description: Public REST + SSE API for The Truth Pill. Generated from NestJS decorators — never hand-edited (ADR-009).
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: 'ADR-017 purpose-issued API token, HS256, `aud: truth-pill-api`, TTL 300 s. Sent as `Authorization: Bearer <token>`, minted server-side only. A token in a query string or body is ignored.'
    internalJobSecret:
      type: apiKey
      in: header
      name: x-internal-secret
      description: '`INTERNAL_JOB_SECRET` on `/internal/*`, compared timing-safely. Worker/cron only; fails closed when unset (Hard Rule 6).'
  schemas:
    ActivityItemDto:
      type: object
      properties:
        articleId:
          type: string
          nullable: true
        content:
          type: string
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - comment
            - signup
            - article
        userId:
          type: string
          nullable: true
      required:
        - id
        - type
        - content
        - timestamp
    AddCommentDto:
      type: object
      properties:
        articleId:
          type: string
          format: uuid
        content:
          type: string
          description: Comment body — non-empty, at most 5000 characters (validated in the service as 422).
        parentId:
          type: string
          format: uuid
          description: Parent comment id — must resolve to a comment on the same article (422 otherwise, DEV-043).
      required:
        - articleId
        - content
    AddQuoteDto:
      type: object
      properties:
        author:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 255
        text:
          type: string
          maxLength: 5000
      required:
        - text
        - author
    AddResearchTopicDto:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        topic:
          type: string
          maxLength: 500
      required:
        - topic
    AddToQueueDto:
      type: object
      properties:
        recipient:
          type: string
          example: ada@example.com
          maxLength: 320
        scheduledFor:
          type: number
          description: Epoch-ms send time; defaults to now.
        subject:
          type: string
          maxLength: 500
        templateData:
          type: object
          additionalProperties: true
          description: Per-template data. Unknown keys or a non-string value → 400 (ADR-010, not `v.any()`).
        templateName:
          type: string
          maxLength: 100
          description: A known template name (unknown → 400).
      required:
        - recipient
        - subject
