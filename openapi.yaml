        '400':
          description: Invalid input or an unknown-field body — a deleted caller-supplied `apiKey` is a 400 (DEV-053).
        '401':
          description: Missing or invalid bearer token (default-deny).
        '403':
          description: The caller is not an admin (DB-resolved role).
        '422':
          description: The provider key is not configured, or the model output could not be parsed.
        '429':
          description: Per-admin billed-action throttle exceeded (`Retry-After`).
      summary: Learn the author style from featured articles (frozen `learnAuthorStyle`, DEV-053)
      tags:
        - ai-actions
  /api/v1/ai-actions/models:
