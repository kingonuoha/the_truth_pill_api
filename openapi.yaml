openapi: 3.0.0
paths:
  /api/v1/admin/dashboard-stats:
    get:
      description: Reads the cache row — never a full-table scan. No user document or secret is projected.
      operationId: AdminController_dashboardStats
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsDto'
        '401':
          description: Missing, invalid, or revoked bearer token.
        '403':
          description: The caller is not an admin (DB-resolved role).
      summary: Dashboard counters from the derived globalStats cache (frozen `admin.getDashboardStats`)
      tags:
        - admin
  /api/v1/admin/recent-activity:
    get:
      operationId: AdminController_recentActivity
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 10
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityItemDto'
        '401':
          description: Missing, invalid, or revoked bearer token.
        '403':
          description: The caller is not an admin (DB-resolved role).
      summary: Recent comments/signups/articles feed (frozen `admin.getRecentActivity`)
      tags:
        - admin
  /api/v1/admin/users:
    get:
      operationId: AdminUsersController_list
      parameters:
        - name: page
          required: false
          in: query
          description: 1-based page number.
          schema:
            minimum: 1
            default: 1
            type: number
        - name: pageSize
          required: false
          in: query
          description: Items per page (1-100).
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserDto'
        '401':
          description: Missing, invalid, expired, or revoked bearer token.
        '403':
          description: The caller is not an admin (DB-resolved role).
      summary: List users (admin only, projected)
      tags:
        - admin-users
  /api/v1/admin/users/{id}/role:
    patch:
      operationId: AdminUsersController_updateRole
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserProjectionDto'
        '401':
          description: Missing, invalid, expired, or revoked bearer token.
        '403':
          description: The caller is not an admin (DB-resolved role).
        '404':
          description: User not found.
      summary: Change a user role (admin only)
      tags:
        - admin-users
  /api/v1/ads-settings/ads-settings:
    get:
      operationId: AdsController_getAdsSettings
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdsSettingsResponseDto'
      security:
        - {}
      summary: Current ad settings, frozen defaults when absent (`ads.getAdsSettings`)
      tags:
        - ads-settings
  /api/v1/ads-settings/update-ads-settings:
    patch:
      operationId: AdsController_updateAdsSettings
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdsSettingsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdsSettingsResponseDto'
        '401':
          description: Missing, invalid, or revoked bearer token.
        '403':
          description: The caller is not an admin (DB-resolved role).
      summary: Upsert the ad settings singleton (frozen `ads.updateAdsSettings`, admin-gated)
      tags:
        - ads-settings
  /api/v1/ai-actions/generate-article-from-topic:
    post:
      description: Reuses the Phase 05 `saveAIDraft` writer and marks the topic processed. Malformed model output is 422.
      operationId: AiActionsController_generateArticleFromTopic
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateArticleFromTopicDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSuccessDto'
        '400':
          description: Invalid input or an unknown-field body — a deleted caller-supplied `apiKey` is a 400 (DEV-053).
        '401':
          description: Missing or invalid bearer token (default-deny).
        '403':
          description: The caller is not an admin (DB-resolved role).
        '422':
          description: The provider key is not configured, or the model output could not be parsed.
        '429':
          description: Per-admin billed-action throttle exceeded (`Retry-After`).
      summary: Generate + persist an AI draft from a topic (frozen `generateArticleFromTopic`, DEV-053)
      tags:
        - ai-actions
  /api/v1/ai-actions/generate-content:
    post:
      description: The key is read server-side; a body carrying `apiKey` is a 400 (deleted field).
      operationId: AiActionsController_generateContent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid input or an unknown-field body — a deleted caller-supplied `apiKey` is a 400 (DEV-053).
        '401':
          description: Missing or invalid bearer token (default-deny).
        '403':
          description: The caller is not an admin (DB-resolved role).
        '422':
          description: The provider key is not configured, or the model output could not be parsed.
        '429':
          description: Per-admin billed-action throttle exceeded (`Retry-After`).
      summary: Generate raw content (frozen `generateContent`, DEV-053)
      tags:
        - ai-actions
  /api/v1/ai-actions/learn-author-style:
